<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Per Apple's current HIG (developer.apple.com/design/human-interface-guidelines/app-icons):
       "provide square layers so the system can apply rounded corners" — macOS masks every
       app icon itself. Baking in our own rounded corners here would get masked a second
       time by the OS, on top of whatever inset we chose, which is what made this icon read
       as "too big" (full-bleed, no inset) and then "too small" (20% inset) in earlier passes.
       So: full-bleed, unrounded, opaque square background; content doesn't need to fill the
       canvas, it just needs breathing room within it. -->
  <rect width="1024" height="1024" fill="#0f131b"/>
  <!-- Purely decorative interior accent, well inside the safe area — unrelated to masking. -->
  <rect x="72" y="72" width="880" height="880" rx="196" fill="none" stroke="#3d7fff" stroke-opacity=".3" stroke-width="10"/>
  <path d="M 690 300 A 260 260 0 1 0 690 724" fill="none" stroke="#3d7fff" stroke-width="84" stroke-linecap="round"/>
  <circle cx="690" cy="512" r="46" fill="#eef1f6"/>
</svg>
