name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      # Test binaries for Tauri apps lack the Windows manifest and fail to start
      # (STATUS_ENTRYPOINT_NOT_FOUND), so on Windows we only verify that they compile.
      - run: cargo test ${{ matrix.os == 'windows-latest' && '--no-run' || '' }}
        working-directory: src-tauri
